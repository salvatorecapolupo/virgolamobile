<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>IEEE 754 Converter</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-ENjdO4Dr2bkBIFxQpeoKVx1KZWR/pi1MZJk/6ZxFNvYjE4h+Il6FZ+Dzv3yg5Qm"
    crossorigin="anonymous"
  />
  <style>
    body { background: #eef2f7; }
    .card { border: none; border-radius: .8rem; box-shadow: 0 0.5rem 1rem rgba(0,0,0,0.1); }
    .nav-pills .nav-link.active { background-color: #0d6efd; }
    .bit-box { font-family: monospace; background: #fff; padding: .4rem .6rem; border-radius: .25rem; }
    pre { background: #f8f9fa; padding: .75rem; border-radius: .5rem; max-height: 300px; overflow-y: auto; }
  </style>
</head>
<body>

<div class="container py-5">
  <div class="card mx-auto" style="max-width: 800px;">
    <div class="card-body">
      <h1 class="h4 text-center mb-4">IEEE 754 Converter (32-bit)</h1>

      <!-- Input -->
      <div class="mb-4">
        <label for="decInput" class="form-label">Numero decimale</label>
        <input type="text" id="decInput" class="form-control" placeholder="Es. -5.828125" />
      </div>
      <div class="text-end mb-4">
        <button id="btnConvert" class="btn btn-primary">Converti</button>
      </div>

      <!-- Tab navigation -->
      <ul class="nav nav-pills mb-4 justify-content-center" id="tabs">
        <li class="nav-item">
          <button class="nav-link active" data-bs-target="#resultTab" data-bs-toggle="pill">Risultato</button>
        </li>
        <li class="nav-item">
          <button class="nav-link" data-bs-target="#stepsTab" data-bs-toggle="pill">Procedimento</button>
        </li>
      </ul>

      <!-- Tab content -->
      <div class="tab-content">
        <!-- Risultato -->
        <div class="tab-pane fade show active" id="resultTab">
          <div class="row text-center mb-3">
            <div class="col">
              <div>Segno</div>
              <div id="bitSign" class="bit-box">-</div>
            </div>
            <div class="col">
              <div>Esponente<br><small>(8-bit, bias 127)</small></div>
              <div id="bitExp" class="bit-box">-</div>
            </div>
            <div class="col">
              <div>Mantissa<br><small>(23-bit)</small></div>
              <div id="bitMan" class="bit-box">-</div>
            </div>
          </div>
          <hr/>
          <div class="text-center mb-3">
            <div>IEEE 754 (32-bit)</div>
            <div id="bitFull" class="bit-box">-</div>
          </div>
        </div>

        <!-- Procedimento -->
        <div class="tab-pane fade" id="stepsTab">
          <h6>Dettaglio dei passaggi:</h6>
          <pre id="calcLog">Nessun calcolo effettuato.</pre>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  const inp = document.getElementById('decInput');
  const btn = document.getElementById('btnConvert');
  const bitSign = document.getElementById('bitSign');
  const bitExp  = document.getElementById('bitExp');
  const bitMan  = document.getElementById('bitMan');
  const bitFull = document.getElementById('bitFull');
  const logPre  = document.getElementById('calcLog');

  btn.addEventListener('click', () => {
    const v = parseFloat(inp.value);
    if (isNaN(v)) {
      alert('Inserisci un numero valido!');
      return;
    }
    const sign = v < 0 ? 1 : 0;
    const absV = Math.abs(v);
    let steps = [];
    steps.push(`Numero input: ${v}`);
    steps.push(`Bit segno: ${sign} (${v<0? 'negativo':'positivo'})`);

    // caso zero
    if (absV === 0) {
      steps.push('Valore zero → esponente e mantissa tutti 0.');
      render(sign, '00000000', '00000000000000000000000', steps);
      return;
    }

    // 1) esponente
    const rawE = Math.floor(Math.log2(absV));
    const biasE = rawE + 127;
    const binE  = biasE.toString(2).padStart(8,'0');
    steps.push(`log2(|v|) = ${Math.log2(absV).toFixed(6)}`);
    steps.push(`Esponente non bias: ${rawE}`);
    steps.push(`Bias 127 → esponente = ${biasE} → binario: ${binE}`);

    // 2) mantissa
    const norm = absV / Math.pow(2, rawE);
    steps.push(`Valore normalizzato: ${norm.toFixed(8)} = 1.x`);
    let frac = norm -1, binM='';
    for (let i=0; i<23; i++){
      frac*=2;
      if(frac>=1){ binM+='1'; frac-=1; }
      else        { binM+='0'; }
    }
    binM = binM.padEnd(23,'0');
    steps.push(`Estraggo 23 bit mantissa: ${binM}`);

    render(sign, binE, binM, steps);
  });

  function render(sign, exp, man, steps){
    const full = `${sign}${exp}${man}`;
    bitSign.textContent = sign;
    bitExp .textContent = exp;
    bitMan .textContent = man;
    bitFull.textContent = full.match(/.{1,8}/g).join(' ');
    logPre.textContent = steps.join('\n');
    // switch to risultato tab
    new bootstrap.Tab(document.querySelector('[data-bs-target="#resultTab"]')).show();
  }
})();
</script>

<script
  src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
  integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+AMvvvtTG2xDnt7wW3kres7p3yXx6"
  crossorigin="anonymous"
></script>
</body>
</html>
